<div class="frontdesk" dir="rtl">
  <header class="frontdesk__header">
    <h1 class="frontdesk__title">{{ headerTitle() }}</h1>
  </header>

  <div class="frontdesk__role-row">
    <div class="frontdesk__header-actions">
      <div class="frontdesk__profile" aria-hidden="true"></div>

      <div class="search-box">
        <span class="search-box__icon" aria-hidden="true"></span>
        <input type="text" placeholder="" />
      </div>
    </div>

    <label class="role-toggle">
      <span>موظف استقبال</span>
      <input type="checkbox" class="role-toggle__checkbox" checked />
    </label>
  </div>

  <div class="frontdesk__body">
    <aside class="frontdesk__nav">
      <nav class="nav-list">
        @for (item of navItems; track item.id) {
          <label class="nav-item" [class.nav-item--active]="item.id === activeView()">
            <input
              type="checkbox"
              class="nav-item__checkbox"
              [checked]="item.id === activeView()"
              (change)="selectView(item.id)"
            />
            <span>{{ item.label }}</span>
          </label>
        }
      </nav>
    </aside>

    <main class="frontdesk__content">
      @switch (activeView()) {
        @case ('registration-requests') {
          <app-patient-requests-page />
        }
        @default {
          <div class="frontdesk__placeholder">قريباً</div>
        }
      }
    </main>
  </div>
</div>
